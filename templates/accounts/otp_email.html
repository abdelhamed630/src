<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .otp-box { font-size: 36px; font-weight: bold; letter-spacing: 12px; color: #2563eb; text-align: center; margin: 32px 0; padding: 20px; background: #eff6ff; border-radius: 8px; }
    .footer { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 style="color:#1e293b; text-align:center;">Email Verification</h2>
    <p style="color:#475569; text-align:center;">Use the code below to verify your account. It expires in <strong>5 minutes</strong>.</p>
    <div class="otp-box">{{ otp }}</div>
    <p style="color:#475569; text-align:center;">If you didn't request this, you can safely ignore this email.</p>
    <div class="footer">© E-Commerce Platform</div>
  </div>
</body>
</html>
